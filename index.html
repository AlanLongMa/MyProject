<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简单登录</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #dbeafe, #eff6ff);
    }

    .login-card {
      width: min(360px, calc(100vw - 32px));
      padding: 32px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #0f172a;
    }

    p {
      margin: 0 0 24px;
      color: #475569;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #1e293b;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #93c5fd;
      border-color: #60a5fa;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 2px;
    }

    .message {
      min-height: 24px;
      margin-top: 16px;
      font-size: 14px;
    }

    .message.error {
      color: #dc2626;
    }

    .message.success {
      color: #16a34a;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>欢迎登录</h1>
    <p>这是一个简单的静态登录演示页面。</p>
    <form id="login-form">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" required>

      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>

      <button type="submit">登录</button>
      <div id="message" class="message" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const message = document.getElementById('message');
    const usernamePattern = /^[A-Za-z0-9_\u4E00-\u9FFF][A-Za-z0-9_\u4E00-\u9FFF-]{0,18}[A-Za-z0-9_\u4E00-\u9FFF]$/u;
    const passwordPattern = /^(?=.*[A-Za-z])(?=.*\d).{8,128}$/;

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const username = form.username.value.trim();
      // Preserve whitespace because spaces may be part of the intended password.
      const password = form.password.value;

      if (!username) {
        message.textContent = '请输入用户名。';
        message.className = 'message error';
        return;
      }

      if (!usernamePattern.test(username)) {
        message.textContent = '用户名需为 2 到 20 位，可包含中文、字母、数字、下划线或短横线，且不能以短横线开头或结尾。';
        message.className = 'message error';
        return;
      }

      if (!passwordPattern.test(password)) {
        message.textContent = '密码需为 8 到 128 位，且需同时包含字母和数字。';
        message.className = 'message error';
        return;
      }

      // Keep textContent here so username is rendered as plain text instead of HTML.
      message.textContent = `登录成功，欢迎你，${username}！`;
      message.className = 'message success';
      form.reset();
    });
  </script>
</body>
</html>
